<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>מרשמים קוליים</title>
<style>
  :root{
    --bg:#15110e;
    --bg2:#221b16;
    --bg3:#2b231c;
    --accent:#e0a24b;
    --accent-dim:#8a6a35;
    --text:#f2e9dd;
    --muted:#a99a86;
    --danger:#c0524a;
    --ok:#6fae6b;
    --border:#3a2f26;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:'Segoe UI', Arial, sans-serif;
    background:var(--bg);
    color:var(--text);
    min-height:100vh;
    padding-bottom:40px;
  }
  header{
    padding:18px 16px 10px;
    text-align:center;
    border-bottom:1px solid var(--border);
    background:var(--bg2);
    position:sticky; top:0; z-index:10;
  }
  header h1{margin:0; font-size:20px; color:var(--accent); letter-spacing:.5px;}
  header .sub{font-size:12px; color:var(--muted); margin-top:2px;}
  .container{max-width:640px; margin:0 auto; padding:16px;}
  .screen{display:none;}
  .screen.active{display:block;}
  .card{
    background:var(--bg2);
    border:1px solid var(--border);
    border-radius:14px;
    padding:16px;
    margin-bottom:14px;
  }
  input[type=text], input[type=tel], textarea{
    width:100%;
    background:var(--bg3);
    border:1px solid var(--border);
    color:var(--text);
    border-radius:10px;
    padding:10px 12px;
    font-size:15px;
    margin-top:4px;
  }
  label{font-size:13px; color:var(--muted); display:block; margin-top:10px;}
  .row{display:flex; gap:10px;}
  .row > div{flex:1;}
  button{
    font-family:inherit;
    cursor:pointer;
    border:none;
    border-radius:10px;
    font-size:15px;
    padding:11px 16px;
  }
  .btn-primary{background:var(--accent); color:#241a0d; font-weight:600; width:100%; margin-top:14px;}
  .btn-secondary{background:var(--bg3); color:var(--text); border:1px solid var(--border); width:100%; margin-top:8px;}
  .btn-danger{background:transparent; color:var(--danger); border:1px solid var(--danger); padding:6px 10px; font-size:13px;}
  .btn-small{background:var(--bg3); color:var(--text); border:1px solid var(--border); padding:6px 10px; font-size:13px;}
  .btn-back{background:none; color:var(--muted); padding:4px 0; font-size:14px;}

  .mic-wrap{display:flex; flex-direction:column; align-items:center; padding:18px 0 6px;}
  .mic-btn{
    width:88px; height:88px; border-radius:50%;
    background:radial-gradient(circle at 35% 30%, #f0b968, var(--accent));
    display:flex; align-items:center; justify-content:center;
    box-shadow:0 0 0 0 rgba(224,162,75,.5);
    transition:transform .15s;
  }
  .mic-btn:active{transform:scale(.94);}
  .mic-btn.listening{
    animation:pulse 1.2s infinite;
    background:radial-gradient(circle at 35% 30%, #ff9a7a, var(--danger));
  }
  @keyframes pulse{
    0%{box-shadow:0 0 0 0 rgba(192,82,74,.6);}
    70%{box-shadow:0 0 0 22px rgba(192,82,74,0);}
    100%{box-shadow:0 0 0 0 rgba(192,82,74,0);}
  }
  .mic-btn svg{width:36px; height:36px;}
  .mic-label{font-size:13px; color:var(--muted); margin-top:8px;}
  .transcript{
    background:var(--bg3);
    border:1px dashed var(--border);
    border-radius:10px;
    padding:10px 12px;
    font-size:13px;
    color:var(--muted);
    min-height:20px;
    margin-top:10px;
    white-space:pre-wrap;
  }
  .search-box{margin-bottom:10px;}
  .patient-item{
    background:var(--bg2); border:1px solid var(--border); border-radius:12px;
    padding:12px 14px; margin-bottom:8px; display:flex; justify-content:space-between; align-items:center;
    cursor:pointer;
  }
  .patient-item:active{background:var(--bg3);}
  .patient-item .name{font-weight:600;}
  .patient-item .phone{font-size:12px; color:var(--muted); margin-top:2px;}
  .empty{color:var(--muted); text-align:center; padding:24px 0; font-size:14px;}

  table.rx{width:100%; border-collapse:collapse; margin-top:6px; direction:ltr; text-align:center; font-size:14px;}
  table.rx th, table.rx td{border:1px solid var(--border); padding:6px 4px;}
  table.rx th{background:var(--bg3); color:var(--accent); font-size:12px;}
  table.rx td.eye{font-weight:700; color:var(--accent);}

  .eye-block{border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:10px;}
  .eye-block h3{margin:0 0 6px; font-size:14px; color:var(--accent);}
  .prism-row{display:flex; gap:8px; align-items:center; margin-top:6px;}
  .prism-row select{background:var(--bg3); color:var(--text); border:1px solid var(--border); border-radius:8px; padding:6px;}
  .prism-row input{width:70px;}
  .add-mode{display:flex; gap:14px; margin-top:8px; font-size:13px;}
  .add-mode label{display:flex; align-items:center; gap:5px; color:var(--text); margin:0;}
  .exam-card{border:1px solid var(--border); border-radius:12px; padding:12px; margin-top:12px;}
  .exam-date{font-size:12px; color:var(--muted); margin-bottom:6px;}
  .note{background:var(--bg3); border-radius:8px; padding:8px 10px; font-size:13px; margin-top:6px;}
  .note .ndate{font-size:11px; color:var(--muted); margin-bottom:2px;}
  .patient-header{margin-bottom:4px;}
  .patient-header .name{font-size:18px; font-weight:700; color:var(--accent);}
  .patient-header .phone{font-size:13px; color:var(--muted);}
  .field-hint{font-size:11px; color:var(--muted); margin-top:2px;}
</style>
</head>
<body>

<header>
  <h1>מרשמים קוליים</h1>
  <div class="sub">רישום בדיקות עיניים בהקלטה קולית</div>
</header>

<div class="container">

  <!-- HOME -->
  <div class="screen active" id="screen-home">
    <div class="card">
      <label>חיפוש מטופל (שם פרטי / משפחה)</label>
      <input type="text" id="search-input" class="search-box" placeholder="הקלד לחיפוש...">
      <div id="patients-list"></div>
      <button class="btn-primary" onclick="startNewPatient()">+ מטופל חדש</button>
    </div>
  </div>

  <!-- NEW PATIENT -->
  <div class="screen" id="screen-newpatient">
    <button class="btn-back" onclick="showScreen('screen-home')">‹ חזרה</button>
    <div class="card">
      <div style="font-weight:600; margin-bottom:4px;">פרטי מטופל</div>
      <div class="field-hint">תאריך בדיקה: <span id="patient-date-display"></span> (אוטומטי)</div>

      <div class="mic-wrap">
        <div class="mic-btn" id="mic-patient" onclick="toggleListen('patient')">
          <svg viewBox="0 0 24 24" fill="#241a0d"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </div>
        <div class="mic-label" id="mic-patient-label">לחץ ואמור: שם, שם משפחה וטלפון</div>
      </div>
      <div class="transcript" id="patient-transcript"></div>

      <label>שם פרטי</label>
      <input type="text" id="pf-firstname">
      <label>שם משפחה</label>
      <input type="text" id="pf-lastname">
      <label>טלפון</label>
      <input type="tel" id="pf-phone">

      <button class="btn-primary" onclick="continueToPrescription()">המשך למרשם ›</button>
    </div>
  </div>

  <!-- PRESCRIPTION -->
  <div class="screen" id="screen-prescription">
    <button class="btn-back" onclick="backFromPrescription()">‹ חזרה</button>
    <div class="card">
      <div style="font-weight:600;">הקלטת מרשם — <span id="rx-patient-name"></span></div>
      <div class="field-hint">תאריך: <span id="rx-date-display"></span></div>

      <div class="mic-wrap">
        <div class="mic-btn" id="mic-rx" onclick="toggleListen('rx')">
          <svg viewBox="0 0 24 24" fill="#241a0d"><path d="M12 14a3 3 0 0 0 3-3V6a3 3 0 0 0-6 0v5a3 3 0 0 0 3 3zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-3.08A7 7 0 0 0 19 11h-2z"/></svg>
        </div>
        <div class="mic-label">לחץ ואמור את המרשם: ימין, שמאל, אדישן</div>
      </div>
      <div class="transcript" id="rx-transcript"></div>

      <div class="eye-block">
        <h3>עין ימין (R)</h3>
        <div class="row">
          <div><label>SPH</label><input type="text" id="r-sph" placeholder="+0.75"></div>
          <div><label>CYL</label><input type="text" id="r-cyl" placeholder="-0.50"></div>
          <div><label>AXIS</label><input type="text" id="r-axis" placeholder="90"></div>
        </div>
        <label>פריזמות</label>
        <div id="r-prisms"></div>
        <button class="btn-small" onclick="addPrismRow('r')">+ הוסף פריזמה</button>
      </div>

      <div class="eye-block">
        <h3>עין שמאל (L)</h3>
        <div class="row">
          <div><label>SPH</label><input type="text" id="l-sph" placeholder="+0.75"></div>
          <div><label>CYL</label><input type="text" id="l-cyl" placeholder="-0.50"></div>
          <div><label>AXIS</label><input type="text" id="l-axis" placeholder="90"></div>
        </div>
        <label>פריזמות</label>
        <div id="l-prisms"></div>
        <button class="btn-small" onclick="addPrismRow('l')">+ הוסף פריזמה</button>
      </div>

      <div class="eye-block">
        <h3>ADD</h3>
        <div class="add-mode">
          <label><input type="radio" name="add-mode" value="bino" checked onchange="renderAddMode()"> דו-עיני</label>
          <label><input type="radio" name="add-mode" value="mono" onchange="renderAddMode()"> חד-עיני</label>
        </div>
        <div id="add-fields"></div>
      </div>

      <button class="btn-primary" onclick="saveExam()">שמור בדיקה</button>
    </div>
  </div>

  <!-- PATIENT DETAIL -->
  <div class="screen" id="screen-detail">
    <button class="btn-back" onclick="showScreen('screen-home')">‹ חזרה לחיפוש</button>
    <div class="card">
      <div class="patient-header">
        <div class="name" id="detail-name"></div>
        <div class="phone" id="detail-phone"></div>
      </div>
      <button class="btn-secondary" onclick="newExamForCurrentPatient()">+ בדיקה חדשה</button>
      <div id="exams-container"></div>
    </div>
  </div>

</div>

<script>
/* ---------------- storage ---------------- */
const LS_PATIENTS = 'eyerx_patients';
const LS_EXAMS = 'eyerx_exams';
function getPatients(){ return JSON.parse(localStorage.getItem(LS_PATIENTS) || '[]'); }
function savePatients(a){ localStorage.setItem(LS_PATIENTS, JSON.stringify(a)); }
function getExams(){ return JSON.parse(localStorage.getItem(LS_EXAMS) || '[]'); }
function saveExams(a){ localStorage.setItem(LS_EXAMS, JSON.stringify(a)); }
function uid(){ return Date.now().toString(36) + Math.random().toString(36).slice(2,7); }

/* ---------------- navigation ---------------- */
let currentPatient = null; // {id, firstName, lastName, phone} while creating/editing
let currentPatientId = null; // when viewing detail

function showScreen(id){
  document.querySelectorAll('.screen').forEach(s=>s.classList.remove('active'));
  document.getElementById(id).classList.add('active');
  if(id==='screen-home') renderPatientsList();
}

/* ---------------- speech recognition ---------------- */
let recognition = null;
let listeningFor = null; // 'patient' | 'rx'
function getRecognition(){
  const R = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!R){ alert('הדפדפן לא תומך בזיהוי קול. יש להשתמש בכרום.'); return null; }
  const r = new R();
  r.lang = 'he-IL';
  r.interimResults = true;
  r.continuous = false;
  return r;
}
function toggleListen(which){
  if(listeningFor===which){ stopListening(); return; }
  if(listeningFor) stopListening();
  recognition = getRecognition();
  if(!recognition) return;
  listeningFor = which;
  const btn = document.getElementById(which==='patient' ? 'mic-patient' : 'mic-rx');
  const box = document.getElementById(which==='patient' ? 'patient-transcript' : 'rx-transcript');
  btn.classList.add('listening');
  box.textContent = 'מקשיב...';
  recognition.onresult = (e)=>{
    let text = '';
    for(let i=0;i<e.results.length;i++) text += e.results[i][0].transcript + ' ';
    box.textContent = text.trim();
    if(e.results[e.results.length-1].isFinal){
      if(which==='patient') applyPatientParse(text.trim());
      else applyRxParse(text.trim());
    }
  };
  recognition.onerror = ()=>{ stopListening(); };
  recognition.onend = ()=>{ stopListening(); };
  recognition.start();
}
function stopListening(){
  if(recognition){ try{ recognition.stop(); }catch(e){} }
  if(listeningFor){
    const btn = document.getElementById(listeningFor==='patient' ? 'mic-patient' : 'mic-rx');
    if(btn) btn.classList.remove('listening');
  }
  listeningFor = null;
}

/* ---------------- patient parsing ---------------- */
function applyPatientParse(raw){
  const digitMatch = raw.match(/\d[\d\s-]{5,}\d/);
  let phone = '';
  let nameText = raw;
  if(digitMatch){
    phone = digitMatch[0].replace(/[\s-]/g,'');
    nameText = raw.replace(digitMatch[0], '').trim();
  }
  const parts = nameText.split(/\s+/).filter(Boolean);
  const firstName = parts[0] || '';
  const lastName = parts.slice(1).join(' ') || '';
  if(firstName) document.getElementById('pf-firstname').value = firstName;
  if(lastName) document.getElementById('pf-lastname').value = lastName;
  if(phone) document.getElementById('pf-phone').value = phone;
}

function todayISO(){ const d=new Date(); return d.toISOString().slice(0,10); }
function todayDisplay(){ const d=new Date(); return d.toLocaleDateString('he-IL'); }

function startNewPatient(){
  currentPatient = null;
  document.getElementById('pf-firstname').value='';
  document.getElementById('pf-lastname').value='';
  document.getElementById('pf-phone').value='';
  document.getElementById('patient-transcript').textContent='';
  document.getElementById('patient-date-display').textContent = todayDisplay();
  showScreen('screen-newpatient');
}

function continueToPrescription(){
  const firstName = document.getElementById('pf-firstname').value.trim();
  const lastName = document.getElementById('pf-lastname').value.trim();
  const phone = document.getElementById('pf-phone').value.trim();
  if(!firstName){ alert('נא להזין שם פרטי'); return; }
  let patients = getPatients();
  let p = { id: uid(), firstName, lastName, phone };
  patients.push(p);
  savePatients(patients);
  currentPatient = p;
  openPrescriptionScreen();
}

function newExamForCurrentPatient(){
  const patients = getPatients();
  currentPatient = patients.find(p=>p.id===currentPatientId);
  openPrescriptionScreen();
}

function openPrescriptionScreen(){
  document.getElementById('rx-patient-name').textContent = currentPatient.firstName + ' ' + currentPatient.lastName;
  document.getElementById('rx-date-display').textContent = todayDisplay();
  document.getElementById('rx-transcript').textContent = '';
  ['r-sph','r-cyl','r-axis','l-sph','l-cyl','l-axis'].forEach(id=>document.getElementById(id).value='');
  document.getElementById('r-prisms').innerHTML='';
  document.getElementById('l-prisms').innerHTML='';
  document.querySelector('input[name="add-mode"][value="bino"]').checked = true;
  renderAddMode();
  showScreen('screen-prescription');
}

function backFromPrescription(){
  if(currentPatientId){ showScreen('screen-detail'); renderPatientDetail(currentPatientId); }
  else showScreen('screen-home');
}

/* ---------------- prescription parsing ---------------- */
function normalizeRx(raw){
  let s = ' ' + raw + ' ';
  s = s.replace(/פלוס/g, ' + ');
  s = s.replace(/מינוס/g, ' - ');
  s = s.replace(/\bעל\b/g, ' CYL ');
  s = s.replace(/איקס|אקס/g, ' AX ');
  s = s.replace(/אדישן|אדיישן|אד\b/g, ' ADD ');
  s = s.replace(/בייס אאוט|בסיס החוצה/g, ' BO ');
  s = s.replace(/בייס אין|בסיס פנימה/g, ' BI ');
  s = s.replace(/בייס אפ|בסיס למעלה/g, ' BU ');
  s = s.replace(/בייס דאון|בסיס למטה/g, ' BD ');
  s = s.replace(/ימין/g, ' EYE_R ');
  s = s.replace(/שמאל/g, ' EYE_L ');
  return s;
}
function parseEyeSegment(seg){
  const sphM = seg.match(/([+-])\s*(\d+(?:\.\d+)?)/);
  const sph = sphM ? ((sphM[1]==='-'?-1:1) * parseFloat(sphM[2])) : null;
  const cylM = seg.match(/CYL\s*([+-]?\s*\d+(?:\.\d+)?)/);
  const cyl = cylM ? parseFloat(cylM[1].replace(/\s/g,'')) : null;
  const axM = seg.match(/AX\s*(\d+(?:\.\d+)?)/);
  const axis = axM ? parseFloat(axM[1]) : null;
  const prisms = [];
  const baseRe = /(\d+(?:\.\d+)?)\s*(BO|BI|BU|BD)/g;
  let m;
  while((m = baseRe.exec(seg))){ prisms.push({power: parseFloat(m[1]), base: m[2]}); }
  return {sph, cyl, axis, prisms};
}
function parsePrescription(raw){
  const s = normalizeRx(raw);
  const addIdx = s.indexOf('ADD');
  const rxPart = addIdx>=0 ? s.slice(0, addIdx) : s;
  const addPart = addIdx>=0 ? s.slice(addIdx+3) : '';
  const sphMatches = [...rxPart.matchAll(/([+-])\s*\d+(?:\.\d+)?/g)];
  let rSeg = '', lSeg = '';
  if(sphMatches.length>=1){
    const rStart = sphMatches[0].index;
    const lStart = sphMatches.length>=2 ? sphMatches[1].index : rxPart.length;
    rSeg = rxPart.slice(rStart, lStart);
    lSeg = sphMatches.length>=2 ? rxPart.slice(lStart) : '';
  }
  const R = parseEyeSegment(rSeg);
  const L = parseEyeSegment(lSeg);
  const add = {mode:'bino', value:null, r:null, l:null};
  if(addPart.trim()){
    const hasR = /EYE_R/.test(addPart);
    const hasL = /EYE_L/.test(addPart);
    if(hasR || hasL){
      add.mode = 'mono';
      const rM = addPart.match(/EYE_R[^0-9+-]*([+-]?\d+(?:\.\d+)?)/);
      const lM = addPart.match(/EYE_L[^0-9+-]*([+-]?\d+(?:\.\d+)?)/);
      add.r = rM ? parseFloat(rM[1]) : null;
      add.l = lM ? parseFloat(lM[1]) : null;
    } else {
      const vM = addPart.match(/([+-]?\d+(?:\.\d+)?)/);
      add.value = vM ? parseFloat(vM[1]) : null;
    }
  }
  return {R, L, add};
}
function fmtSigned(n){
  if(n===null || n===undefined || isNaN(n)) return '';
  return (n>=0? '+':'') + n.toFixed(2);
}
function applyRxParse(raw){
  const parsed = parsePrescription(raw);
  document.getElementById('r-sph').value = parsed.R.sph!==null ? fmtSigned(parsed.R.sph) : '';
  document.getElementById('r-cyl').value = parsed.R.cyl!==null ? fmtSigned(parsed.R.cyl) : '';
  document.getElementById('r-axis').value = parsed.R.axis!==null ? parsed.R.axis : '';
  document.getElementById('l-sph').value = parsed.L.sph!==null ? fmtSigned(parsed.L.sph) : '';
  document.getElementById('l-cyl').value = parsed.L.cyl!==null ? fmtSigned(parsed.L.cyl) : '';
  document.getElementById('l-axis').value = parsed.L.axis!==null ? parsed.L.axis : '';
  document.getElementById('r-prisms').innerHTML='';
  parsed.R.prisms.forEach(p=>addPrismRow('r', p.power, p.base));
  document.getElementById('l-prisms').innerHTML='';
  parsed.L.prisms.forEach(p=>addPrismRow('l', p.power, p.base));
  if(parsed.add.mode==='mono'){
    document.querySelector('input[name="add-mode"][value="mono"]').checked = true;
    renderAddMode();
    if(parsed.add.r!==null) document.getElementById('add-r').value = fmtSigned(parsed.add.r);
    if(parsed.add.l!==null) document.getElementById('add-l').value = fmtSigned(parsed.add.l);
  } else {
    document.querySelector('input[name="add-mode"][value="bino"]').checked = true;
    renderAddMode();
    if(parsed.add.value!==null) document.getElementById('add-bino').value = fmtSigned(parsed.add.value);
  }
}

function addPrismRow(eye, power, base){
  const container = document.getElementById(eye+'-prisms');
  const rowId = uid();
  const div = document.createElement('div');
  div.className = 'prism-row';
  div.id = 'prism-'+rowId;
  div.innerHTML = `
    <input type="text" placeholder="עוצמה" value="${power!==undefined?power:''}" class="prism-power">
    <select class="prism-base">
      <option value="BU" ${base==='BU'?'selected':''}>Base Up</option>
      <option value="BD" ${base==='BD'?'selected':''}>Base Down</option>
      <option value="BI" ${base==='BI'?'selected':''}>Base In</option>
      <option value="BO" ${base==='BO'?'selected':''}>Base Out</option>
    </select>
    <button class="btn-danger" onclick="document.getElementById('prism-${rowId}').remove()">מחק</button>
  `;
  container.appendChild(div);
}

function renderAddMode(){
  const mode = document.querySelector('input[name="add-mode"]:checked').value;
  const container = document.getElementById('add-fields');
  if(mode==='bino'){
    container.innerHTML = `<label>ADD (דו-עיני)</label><input type="text" id="add-bino" placeholder="+2.00">`;
  } else {
    container.innerHTML = `
      <div class="row">
        <div><label>ADD ימין</label><input type="text" id="add-r" placeholder="+2.00"></div>
        <div><label>ADD שמאל</label><input type="text" id="add-l" placeholder="+2.00"></div>
      </div>`;
  }
}

function collectPrisms(eye){
  const rows = document.querySelectorAll('#'+eye+'-prisms .prism-row');
  const out = [];
  rows.forEach(r=>{
    const power = r.querySelector('.prism-power').value.trim();
    const base = r.querySelector('.prism-base').value;
    if(power) out.push({power: parseFloat(power), base});
  });
  return out;
}

function saveExam(){
  const mode = document.querySelector('input[name="add-mode"]:checked').value;
  let add;
  if(mode==='bino'){
    add = {mode:'bino', value: document.getElementById('add-bino').value.trim() || null};
  } else {
    add = {mode:'mono', r: document.getElementById('add-r').value.trim() || null, l: document.getElementById('add-l').value.trim() || null};
  }
  const exam = {
    id: uid(),
    patientId: currentPatient.id,
    date: todayISO(),
    R: {
      sph: document.getElementById('r-sph').value.trim(),
      cyl: document.getElementById('r-cyl').value.trim(),
      axis: document.getElementById('r-axis').value.trim(),
      prisms: collectPrisms('r')
    },
    L: {
      sph: document.getElementById('l-sph').value.trim(),
      cyl: document.getElementById('l-cyl').value.trim(),
      axis: document.getElementById('l-axis').value.trim(),
      prisms: collectPrisms('l')
    },
    add,
    notes: []
  };
  const exams = getExams();
  exams.push(exam);
  saveExams(exams);
  currentPatientId = currentPatient.id;
  showScreen('screen-detail');
  renderPatientDetail(currentPatientId);
}

/* ---------------- home / search ---------------- */
function renderPatientsList(){
  const q = (document.getElementById('search-input').value || '').trim();
  const patients = getPatients();
  const container = document.getElementById('patients-list');
  let filtered = patients;
  if(q){
    filtered = patients.filter(p =>
      (p.firstName+' '+p.lastName).includes(q) || p.lastName.includes(q) || p.firstName.includes(q)
    );
  }
  filtered = filtered.slice().reverse();
  if(filtered.length===0){
    container.innerHTML = '<div class="empty">אין מטופלים תואמים</div>';
    return;
  }
  container.innerHTML = '';
  filtered.forEach(p=>{
    const div = document.createElement('div');
    div.className='patient-item';
    div.onclick = ()=>{ currentPatientId = p.id; showScreen('screen-detail'); renderPatientDetail(p.id); };
    div.innerHTML = `<div><div class="name">${p.firstName} ${p.lastName}</div><div class="phone">${p.phone||''}</div></div><div>›</div>`;
    container.appendChild(div);
  });
}
document.getElementById('search-input').addEventListener('input', renderPatientsList);

/* ---------------- patient detail ---------------- */
function rxRowHtml(label, eye){
  const prismStr = (eye.prisms||[]).map(p=>`${p.power}${p.base}`).join(', ');
  return `<tr><td class="eye">${label}</td><td>${eye.sph||''}</td><td>${eye.cyl||''}</td><td>${eye.axis||''}</td><td>${prismStr}</td></tr>`;
}
function addDisplay(exam){
  if(exam.add.mode==='bino') return exam.add.value ? `ADD: ${exam.add.value} (דו-עיני)` : '';
  const parts=[];
  if(exam.add.r) parts.push('R '+exam.add.r);
  if(exam.add.l) parts.push('L '+exam.add.l);
  return parts.length ? 'ADD: '+parts.join(' / ') : '';
}
function renderPatientDetail(patientId){
  const patients = getPatients();
  const p = patients.find(x=>x.id===patientId);
  if(!p) return;
  document.getElementById('detail-name').textContent = p.firstName+' '+p.lastName;
  document.getElementById('detail-phone').textContent = p.phone||'';
  const exams = getExams().filter(e=>e.patientId===patientId).sort((a,b)=> b.date.localeCompare(a.date) || b.id.localeCompare(a.id));
  const container = document.getElementById('exams-container');
  if(exams.length===0){
    container.innerHTML = '<div class="empty">אין בדיקות עדיין</div>';
    return;
  }
  container.innerHTML = '';
  exams.forEach(ex=>{
    const card = document.createElement('div');
    card.className='exam-card';
    const dateDisp = new Date(ex.date).toLocaleDateString('he-IL');
    const addLine = addDisplay(ex);
    card.innerHTML = `
      <div class="exam-date">בדיקה מתאריך ${dateDisp}</div>
      <table class="rx">
        <tr><th>Eye</th><th>SPH</th><th>CYL</th><th>AXIS</th><th>PRISM</th></tr>
        ${rxRowHtml('R', ex.R)}
        ${rxRowHtml('L', ex.L)}
      </table>
      ${addLine ? `<div style="margin-top:6px; font-size:13px; direction:ltr; text-align:left; color:var(--accent);">${addLine}</div>` : ''}
      <div id="notes-${ex.id}"></div>
      <textarea rows="2" placeholder="הוסף הערה..." id="noteinput-${ex.id}" style="margin-top:8px;"></textarea>
      <button class="btn-small" style="margin-top:6px;" onclick="addNote('${ex.id}')">שמור הערה</button>
    `;
    container.appendChild(card);
    renderNotes(ex);
  });
}
function renderNotes(ex){
  const box = document.getElementById('notes-'+ex.id);
  if(!box) return;
  box.innerHTML = (ex.notes||[]).map(n=>{
    const d = new Date(n.date).toLocaleString('he-IL');
    return `<div class="note"><div class="ndate">${d}</div>${n.text}</div>`;
  }).join('');
}
function addNote(examId){
  const input = document.getElementById('noteinput-'+examId);
  const text = input.value.trim();
  if(!text) return;
  const exams = getExams();
  const ex = exams.find(e=>e.id===examId);
  if(!ex) return;
  ex.notes = ex.notes || [];
  ex.notes.push({text, date: new Date().toISOString()});
  saveExams(exams);
  input.value='';
  renderNotes(ex);
}

/* ---------------- init ---------------- */
renderPatientsList();
</script>
</body>
</html>
